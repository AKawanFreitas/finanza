# Sobe o Finanza (API + front) com os dados em um volume.
#   cp .env.example .env     (ajuste o que precisar)
#   docker compose up -d --build
# Abre em http://localhost:4747. O primeiro administrador é criado assim:
#   docker compose exec finanza node backend/scripts/create-admin.js --email voce@exemplo.com --nome "Seu Nome"
services:
  finanza:
    build: .
    image: finanza:latest
    restart: unless-stopped
    ports:
      - "${PORT:-4747}:4747"
    environment:
      PORT: "4747"
      APP_URL: ${APP_URL:-http://localhost:4747}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Finanza <nao-responda@finanza.local>}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Local, sem HTTPS: false. Atrás de um proxy com HTTPS: remova (ou true) e defina TRUST_PROXY=1.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Contas de teste criadas ao subir (vazio = não cria). Veja o .env.example.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_SENHA: ${BOOTSTRAP_ADMIN_SENHA:-}
      BOOTSTRAP_ADMIN_NOME: ${BOOTSTRAP_ADMIN_NOME:-Administrador}
      BOOTSTRAP_DEMO: ${BOOTSTRAP_DEMO:-false}
      BOOTSTRAP_DEMO_EMAIL: ${BOOTSTRAP_DEMO_EMAIL:-demo@finanza.local}
      BOOTSTRAP_DEMO_SENHA: ${BOOTSTRAP_DEMO_SENHA:-demo1234}
    volumes:
      - finanza-data:/data

volumes:
  finanza-data:
