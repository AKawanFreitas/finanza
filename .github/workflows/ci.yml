name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Front (lint e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Imagem Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finanza:ci .
      - name: A imagem sobe e responde ao healthcheck
        run: |
          docker run -d --name finanza -e COOKIE_SECURE=false -p 4747:4747 finanza:ci
          for i in $(seq 1 20); do curl -fs http://localhost:4747/api/health && exit 0; sleep 1; done
          docker logs finanza
          exit 1
